<style>

dialog{border:2px solid var(--gold);border-radius:12px;padding:18px;max-width:430px;width:92vw;background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;border:1px solid var(--gold);z-index:99;max-width:90vw}
.rpl{position:absolute;border-radius:50%;width:12px;height:12px;margin:-6px;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.cfw{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}.cfp{position:absolute;width:9px;height:14px;border-radius:2px;animation:cfa 1.4s ease-out forwards}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn .r{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex:none}.dn .r span{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 1rem Georgia,serif}.lgd{font-size:.82rem}.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pop{from{opacity:0;transform:scale(.55) rotate(-100deg)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes bub{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)}}@keyframes rip{to{transform:scale(18);opacity:0}}@keyframes cfa{to{transform:translate(var(--x),var(--y)) rotate(600deg);opacity:0}}@keyframes ringg{from{stroke-dasharray:0 100}}
html:not([data-motion="off"]) #v .k,html:not([data-motion="off"]) #v .card{animation:up .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
html:not([data-motion="off"]) .cols div i{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + .2s)}
html:not([data-motion="off"]) .hb span i{transform-origin:left;animation:growx 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*90ms + .2s)}
html:not([data-motion="off"]) .dn .r{animation:pop .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:.2s}
html:not([data-motion="off"]) svg .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards}html:not([data-motion="off"]) svg .pt{animation:fade .5s 1.2s backwards}
html:not([data-motion="off"]) .rp{animation:ringg 1.2s ease backwards}html:not([data-motion="off"]) .bb,html:not([data-motion="off"]) .tl{animation:bub .4s backwards;animation-delay:calc(var(--i,0)*60ms)}
html:not([data-motion="off"]) .ib b{animation:pulse 2s infinite}html:not([data-motion="off"]) .step i.d{animation:growx .8s backwards}
.card:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
@media (max-width:640px){.who{display:none}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}.rpl,.cfw{display:none}}
</style>

<body>

<script>
const $=s=>document.querySelector(s),kes=n=>"KES "+Math.round(n).toLocaleString("en-KE"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang="en",tt,cur=location.hash.slice(1)||"home";const L=(a,b)=>lang=="sw"?b:a,now=()=>new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const mOff=()=>document.documentElement.dataset.motion=="off"||matchMedia("(prefers-reduced-motion:reduce)").matches;
const toast=t=>{document.querySelectorAll(".toast").forEach(e=>e.remove());document.body.insertAdjacentHTML("beforeend",`<div class="toast" role="status">${t}</div>`);clearTimeout(tt);tt=setTimeout(()=>document.querySelectorAll(".toast").forEach(e=>e.remove()),3200)};
function confetti(){if(mOff())return;let h="";for(let i=0;i<30;i++)h+=`<i class="cfp" style="left:${40+Math.random()*20}vw;top:35vh;--x:${(Math.random()-.5)*420}px;--y:${-120+Math.random()*380}px;background:${["#c9a227","#1f9d62","#1b6fe0","#c0392b","#7a4fd0"][i%5]}"></i>`;document.body.insertAdjacentHTML("beforeend",`<div class="cfw">${h}</div>`);setTimeout(()=>document.querySelectorAll(".cfw").forEach(e=>e.remove()),1600)}
const ring=(p,c="#1f9d62")=>`<svg viewBox="0 0 42 42" width="96" height="96" role="img" aria-label="${p}%"><circle cx="21" cy="21" r="16" fill="none" stroke="var(--line)" stroke-width="5"/><circle class="rp" cx="21" cy="21" r="16" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100" transform="rotate(-90 21 21)"/><text x="21" y="24" text-anchor="middle" font-size="9" font-weight="700" style="fill:var(--ink)">${p}%</text></svg>`;

const dlg=$("#dlg"),modal=h=>{dlg.innerHTML=h;dlg.showModal()};dlg.addEventListener("click",e=>{if(e.target.closest("[data-x]"))dlg.close()});
const cl=`<button type="button" class="btn gh" data-x>${"Close"}</button>`,okP=p=>/^(07|01)\d{8}$/.test(p),op=a=>a.map(x=>`<option>${x}</option>`).join("");
const S={P:{ph:"0712345678",wa:"0712345678",em:"amina@example.com",oc:"Teacher"},owe:[["Funeral levy (due 5 Nov)",200],["Late fine, 25% of KES 200",50]],
hist:[["02 Oct 2026","Funeral levy",200,"R-0233"],["04 Aug 2026","Medical levy",200,"R-0198"],["11 Jun 2026","Education levy",200,"R-0150"],["12 Mar 2019","Registration + Hazina",600,"R-0001"]],

enq:[{id:"ENQ-0014",sub:"My M-Pesa payment is not showing",c:"Payment",st:"Received",m:[["me","I paid my funeral levy by M-Pesa this morning but my account still shows it as owing."]]}],

pref:{email:1,sms:1,wa:0,news:1},resign:null,pre:null,chat:[["bot","Hello Amina. Ask me about your membership, contributions or the constitution, in English or Kiswahili. I answer from fixed rules and your own record, so I never invent a benefit.","Prototype"]]};

const FM=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov"],ser=k=>{let b=FD[k].o;return FD[k].i.map((v,j)=>b=b+v-FD[k].x[j])};

if(/deni|owe|outstanding|how much do i/.test(t))return[o?T("You owe "+kes(o)+": funeral levy KES 200 and a late fine of KES 50 (25%).","Una deni la "+kes(o)+": mchango wa msiba KES 200 na faini ya KES 50 (25%)."):T("You owe nothing. You are up to date.","Huna deni. Umelipa yote."),"Your record"];
if(/matibabu|medical|hospital/.test(t))return[T("Medical help is 60% of the remaining bill after SHA pays, for bills of at least KES 10,000, subject to the Welfare Fund and committee approval. You must be active, have paid the latest two periods and owe nothing."+(o?" Right now you owe "+kes(o)+", so under the standard rules you would not qualify until you clear it. Emergencies can go to leadership.":""),"Msaada wa matibabu ni 60% ya bili iliyobaki baada ya SHA, kwa bili ya angalau KES 10,000, kulingana na Mfuko wa Ustawi na idhini ya kamati. Lazima uwe hai, umelipa vipindi viwili vya mwisho na huna deni."+(o?" Kwa sasa una deni la "+kes(o)+", kwa hivyo hustahili hadi ulipe. Dharura huenda kwa uongozi.":"")),"Constitution + your record"];
if(/(nani|who|eligible|anastahili|qualif)/.test(t)&&/(mazishi|msiba|funeral|burial)/.test(t))return[T("KES 40,000 is paid for the death of a member (to the registered next of kin), a member’s spouse, a parent or recognised guardian, or a child older than six months. For a child up to six months it is KES 20,000. Stillbirth is not covered. If several members recognise the same parent, the KES 40,000 is shared equally.","KES 40,000 hulipwa kwa kifo cha mwanachama (kwa jamaa wa karibu aliyesajiliwa), mke/mume, mzazi au mlezi, au mtoto zaidi ya miezi sita. Mtoto hadi miezi sita ni KES 20,000. Mtoto aliyezaliwa amekufa hahusiki. Mzazi akitambuliwa na wanachama kadhaa, KES 40,000 hugawanywa sawa."),"Constitution"];
if(/mchango wa msiba|funeral|msiba|levy/.test(t))return[T("For a child up to six months each member gives KES 100 and the benefit is KES 20,000. For a child older than six months each gives KES 200 and the benefit is KES 40,000. For other deaths the benefit is KES 40,000 and the committee announces the contribution. Once a death is verified, the benefit is paid from the Welfare Fund without waiting for contributions.","Kwa mtoto hadi miezi sita kila mwanachama huchanga KES 100 na msaada ni KES 20,000. Kwa mtoto zaidi ya miezi sita kila mmoja huchanga KES 200 na msaada ni KES 40,000. Kwa vifo vingine msaada ni KES 40,000 na kamati hutangaza mchango. Kifo kikithibitishwa, msaada hulipwa kutoka Mfuko wa Ustawi bila kusubiri michango."),"Constitution"];
if(/mkutano|meeting|agm/.test(t))return[T("The Annual General Meeting is on 27 December. Committee meetings are held at least every two months and general meetings every six months. The date of the next general meeting has not been announced yet.","Mkutano Mkuu wa Mwaka ni tarehe 27 Desemba. Kamati hukutana angalau kila miezi miwili na mikutano mikuu kila miezi sita. Tarehe ya mkutano mkuu ujao haijatangazwa."),"Constitution + notices"];
if(/kujiondoa|resign|leave|withdraw/.test(t))return[T("Give at least 30 days’ written notice to the General Secretary and settle any debts and fines. The KES 200 registration fee and KES 400 Hazina contribution are not refunded. You can start this under My profile.","Toa notisi ya maandishi ya angalau siku 30 kwa Katibu Mkuu na ulipe madeni na faini zote. Ada ya usajili KES 200 na Hazina KES 400 hazirudishwi. Anza hapa: Wasifu wangu."),"Constitution"];
if(/uchaguzi|election|vote|kura/.test(t))return[T("Elections are held every three years at the AGM on 27 December. A term lasts three years and a leader may serve at most three consecutive terms in one position. Your record shows you are eligible to vote as an active member.","Uchaguzi hufanyika kila miaka mitatu kwenye Mkutano Mkuu tarehe 27 Desemba. Muhula ni miaka mitatu na kiongozi anaweza kuhudumu mihula mitatu mfululizo tu. Rekodi yako inaonyesha unastahili kupiga kura."),"Constitution + your record"];
if(/elimu|education|school|fees/.test(t))return[T("Education help is for academically outstanding students whose families cannot pay. The committee assesses each case against available funds; high marks alone do not guarantee support and partial support is possible.","Msaada wa elimu ni kwa wanafunzi wenye ufaulu mzuri ambao familia hazimudu gharama. Kamati hutathmini kila kesi kulingana na fedha; alama nzuri peke yake hazihakikishi msaada."),"Constitution"];
if(/faini|fine|penalty|late/.test(t))return[T("A required contribution not paid in time, without an accepted reason, attracts a fine of 25%. For KES 200 that is KES 50. It applies only after the deadline and any exception decision are recorded.","Mchango usiolipwa kwa wakati, bila sababu inayokubalika, hutozwa faini ya 25%. Kwa KES 200 ni KES 50. Inatumika baada ya tarehe ya mwisho na uamuzi wa kipekee kurekodiwa."),"Constitution"];
return[T("I can only answer from the constitution rules and your own record. Send an enquiry to the Secretary and a person will reply.","Naweza kujibu kutoka kwa katiba na rekodi yako tu. Tuma swali kwa Katibu na mtu atakujibu."),"Not found"]};
V.ask=()=>`<div class="head"><h1>${L("Ask MADEWEG","Uliza MADEWEG")}</h1><p>${L("Prototype assistant: fixed rules, not AI","Msaidizi wa majaribio: kanuni zilizowekwa")}</p></div><div class="card"><div id="cb">${S.chat.map(b=>`<div class="bb ${b[0]=="me"?"me":"u"}">${esc(b[1])}<small>${b[2]||""}</small></div>`).join("")}</div><div class="chips">${["Nimesajiliwa?","Nina deni la michango kiasi gani?","Nina haki ya kupata msaada wa matibabu?","Ni kiasi gani cha mchango wa msiba?","Nani anastahili kupata msaada wa mazishi?","Mkutano ujao ni lini?","Ninawezaje kujiondoa kwenye MADEWEG?","Katiba inasema nini kuhusu uchaguzi?"].map(q=>`<button class="cp" data-act="q" data-q="${q}">${q}</button>`).join("")}</div><form id="af" class="fg" style="grid-template-columns:1fr auto;margin-top:8px"><input id="aq" placeholder="${L("Type your question","Andika swali lako")}" aria-label="Question" required><button class="btn go">${L("Ask","Uliza")}</button></form></div>`;
V.ask.init=()=>{const ask=q=>{const a=ANS(q);S.chat.push(["me",q,""],["bot",a[0],a[1]]);render();$("#cb").lastElementChild.scrollIntoView({block:"nearest"})};$("#af").onsubmit=e=>{e.preventDefault();ask($("#aq").value)};$("#v").onclick2=ask;window.__ask=ask};
const TABS=[["home","Home","Nyumbani"],["pay","Contributions","Michango"],["help","Welfare","Msaada"],["stu","Students","Wanafunzi"],["fam","Family","Familia"],["fund","Funds","Mifuko"],["meet","Meetings","Mikutano"],["msg","Messages","Ujumbe"],["me","My profile","Wasifu"],["ask","Ask MADEWEG","Uliza"]];
function anim(){document.querySelectorAll("#v .k,#v .card,#v .cols div,#v .hb,#v .bb,#v .tl").forEach(e=>e.style.setProperty("--i",[...e.parentNode.children].indexOf(e)));if(mOff())return;
document.querySelectorAll("#v .k b").forEach(el=>{const t=el.textContent,m=t.match(/[\d,]+/);if(!m)return;const v=parseFloat(m[0].replace(/,/g,""));if(!v)return;const t0=performance.now(),st=n=>{const p=Math.min(1,(n-t0)/900),x=v*(1-Math.pow(1-p,3));el.textContent=t.replace(m[0],Math.round(x).toLocaleString("en-KE"));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
function render(){if(!V[cur])cur="home";$("#tabs").innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t[0]==cur}" class="${t[0]==cur?"on":""}" data-go="${t[0]}">${lang=="sw"?t[2]:t[1]}${t[0]=="msg"&&unread()?` (${unread()})`:""}</button>`).join("");$("#v").innerHTML=V[cur]();V[cur].init&&V[cur].init();$("#bc").textContent=unread()+S.apps.filter(a=>a[5]<3).length;$("#lang").textContent=lang=="en"?"SW":"EN";anim()}
function go(t){cur=t;history.replaceState(null,"","#"+t);render();scrollTo(0,0)}
function payModal(){const o=owing();modal(`<h2>${L("Pay with M-Pesa","Lipa kwa M-Pesa")}</h2><p class="sub">${L("You will get a prompt on your phone to enter your M-Pesa PIN.","Utapata ujumbe kwenye simu yako kuingiza PIN.")}</p><label>Amount (KES)<input id="pa" type="number" min="1" value="${o}"></label><label>M-Pesa phone number<input id="pp" inputmode="tel" value="${S.P.ph}"></label><div class="acts"><button class="btn go" id="ps">${L("Send payment request","Tuma ombi la malipo")}</button>${cl}</div><div class="msg" id="pm" role="status"></div>`);
$("#ps").onclick=()=>{const p=$("#pp").value.replace(/\s/g,""),a=+$("#pa").value,m=$("#pm");if(!okP(p)){m.className="msg bad";return m.textContent="Enter a valid 10-digit phone number starting with 07 or 01."}if(!(a>0)){m.className="msg bad";return m.textContent="Enter an amount greater than zero."}
m.className="msg";m.innerHTML=`Request sent to ${p} for ${kes(a)}. Your balance changes only after M-Pesa confirms.<div class="acts"><button class="btn sm gh" id="pd">Simulate M-Pesa confirmation (demo)</button></div>`;$("#pd").onclick=()=>{let r=a;S.owe=S.owe.map(x=>{const k=Math.min(x[1],r);r-=k;return[x[0],x[1]-k]}).filter(x=>x[1]>0);S.hist.unshift([now(),"Contribution",a,"R-"+String(234+S.hist.length).padStart(4,"0")]);dlg.close();confetti();render();toast("Payment confirmed (demo). Receipt added.")}}}
function editModal(){modal(`<h2>${L("Edit my details","Hariri taarifa zangu")}</h2><form id="ed"><label>Telephone<input name="ph" value="${S.P.ph}"></label><label>WhatsApp<input name="wa" value="${S.P.wa}"></label><label>Email<input name="em" type="email" value="${esc(S.P.em)}"></label><label>Occupation<input name="oc" value="${esc(S.P.oc)}"></label><div class="msg" id="em2"></div><div class="acts"><button class="btn go">Save</button>${cl}</div></form>`);
$("#ed").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),b=t=>{$("#em2").className="msg bad";$("#em2").textContent=t};if(!okP(f.get("ph")))return b("Enter a valid 10-digit phone number.");if(f.get("wa")&&!okP(f.get("wa")))return b("Enter a valid WhatsApp number.");if(f.get("em")&&!/^\S+@\S+\.\S+$/.test(f.get("em")))return b("Enter a valid email address.");Object.assign(S.P,{ph:f.get("ph"),wa:f.get("wa"),em:f.get("em"),oc:f.get("oc")});dlg.close();render();toast("Details saved.")}}
function formModal(title,fields,done){modal(`<h2>${title}</h2><form id="mf">${fields}<div class="msg" id="mm" role="status"></div><div class="acts"><button class="btn go">Submit</button>${cl}</div></form>`);$("#mf").onsubmit=e=>{e.preventDefault();done(new FormData(e.target),t=>{$("#mm").className="msg bad";$("#mm").textContent=t})}}
const ACT={pay:payModal,edit:editModal,stmt:()=>exportFile("MADEWEG statement MDW-0001",["Date","For","Amount (KES)","Receipt"],S.hist.map(h=>[h[0],h[1],h[2],h[3]])),
rcpt:b=>toast("Receipt "+b.dataset.r+" downloaded."),doc:b=>toast(b.dataset.d+" opened (sample)."),
fine:()=>formModal("Ask for a fine review",`<label>Why should the fine be reviewed?<textarea name="r" rows="3" required></textarea></label>`,(f,bad)=>{if(f.get("r").trim().length<10)return bad("Please give a little more detail.");dlg.close();toast("Sent to the committee for review.")}),
stuadd:()=>formModal("List a student",`<label>Student name<input name="n" required></label><label>School or institution<input name="s" required></label><label>Level<select name="l">${op(["Primary","Secondary","Higher education","Other approved"])}</select></label><label>Support status<select name="t">${op(["Seeking support","Not seeking support"])}</select></label>`,(f)=>{S.stu.push({id:"STU-"+String(2+S.stu.length).padStart(3,"0"),n:f.get("n"),s:f.get("s"),l:f.get("l"),st:f.get("t"),p:[]});dlg.close();render();toast("Student listed. The admin register is updated after verification.")}),
stures:b=>formModal("Add results",`<label>Term or semester<input name="t" required></label><label>Mean score (%)<input name="v" type="number" min="0" max="100" step="0.1" required></label>`,(f,bad)=>{const s=S.stu.find(x=>x.id==b.dataset.s),v=+f.get("v");if(!(v>=0&&v<=100))return bad("Score must be between 0 and 100.");s.p.push([f.get("t"),v]);dlg.close();render();toast("Results added.")}),
stuap:b=>{const s=S.stu.find(x=>x.id==b.dataset.s);S.pre={type:"education",who:s.n};go("help")},
famreq:()=>formModal("Request a change",`<label>Change<select name="c">${op(["Add a person","Remove a person","Correct details"])}</select></label><label>Person’s name<input name="n" required></label><label>Relationship<select name="r">${op(["Husband or wife","Father","Mother","Guardian","Child","Next of kin","Other"])}</select></label><label>Reason<textarea name="y" rows="2" required></textarea></label><label>Document<input type="file"></label>`,(f)=>{S.chg.unshift([f.get("c")+": "+f.get("n"),f.get("y"),now()]);dlg.close();render();toast("Request sent for verification by the Secretary.")}),
sens:()=>formModal("Change name, ID or date of birth",`<label>What to change<select name="f">${op(["Full name","National ID number","Date of birth"])}</select></label><label>New value<input name="v" required></label><label>Reason<textarea name="y" rows="2" required></textarea></label><label>Supporting document<input type="file" required></label>`,(f)=>{S.chg.unshift([f.get("f")+" change",f.get("y"),now()]);dlg.close();toast("Sent to an administrator for verification. It is recorded in the audit log.")}),
resign:()=>{const min=new Date(Date.now()+30*864e5).toISOString().slice(0,10);formModal("Request to resign",`<div class="nn">At least 30 days’ written notice to the General Secretary. You must settle debts and fines (now: ${kes(owing())}). The KES 200 and KES 400 are not refunded.</div><label>Date you want to leave<input name="d" type="date" min="${min}" required></label><label>Reason (optional)<textarea name="y" rows="2"></textarea></label>`,(f,bad)=>{if(f.get("d")<min)return bad("The notice period is at least 30 days.");S.resign=f.get("d");dlg.close();render();toast("Resignation request registered. The Secretary will confirm.")})},
dpa:()=>formModal("My data rights",`<label>Request<select name="r">${op(["Access to my data","Correction of my data","Deletion (subject to lawful record keeping)","Objection to processing"])}</select></label><label>Details<textarea name="y" rows="2" required></textarea></label><p class="sub">Financial and constitutional records are kept as the law requires.</p>`,()=>{dlg.close();toast("Request logged and sent to the Secretary.")}),
read:b=>{const i=+b.dataset.i,m=S.msg[i];m[3]=1;const box=$("#mb"+i);box.innerHTML=`<p style="margin:.3rem 0">${esc(m[1])}</p>`;b.closest(".tl").querySelector(".dot").textContent="✉️";$("#tabs").querySelector('[data-go="msg"]').textContent=(lang=="sw"?"Ujumbe":"Messages")+(unread()?` (${unread()})`:"");$("#bc").textContent=unread()+S.apps.filter(a=>a[5]<3).length},
q:b=>window.__ask&&window.__ask(b.dataset.q)};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act],[data-go]");if(!b){if(!e.target.closest("#bp,#bell"))$("#bp").hidden=true;return}if(b.dataset.go)return go(b.dataset.go);const a=ACT[b.dataset.act];a&&a(b)});
$("#v").addEventListener("change",e=>{const p=e.target.dataset.p;if(p){S.pref[p]=e.target.checked?1:0;toast("Preference saved.")}});
document.addEventListener("click",e=>{const b=e.target.closest(".btn");if(!b||mOff()||b.disabled)return;const r=b.getBoundingClientRect(),s=document.createElement("span");s.className="rpl";s.style.left=e.clientX-r.left+"px";s.style.top=e.clientY-r.top+"px";b.appendChild(s);setTimeout(()=>s.remove(),600)});
$("#v").addEventListener("mousemove",e=>{const k=e.target.closest(".k");if(!k||mOff())return;const r=k.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;k.style.transform=`perspective(600px) rotateX(${-y*8}deg) rotateY(${x*10}deg) translateY(-3px)`});$("#v").addEventListener("mouseout",e=>{const k=e.target.closest(".k");if(k)k.style.transform=""});
$("#bell").onclick=e=>{e.stopPropagation();const bp=$("#bp");bp.hidden=!bp.hidden;bp.innerHTML="<b>"+L("For you","Kwako")+"</b>"+[[unread()+" "+L("unread messages","ujumbe haujasomwa"),"msg"],[owing()?kes(owing())+" "+L("owing","deni"):L("No payments due","Hakuna malipo"),"pay"],[S.apps.filter(a=>a[5]<3).length+" "+L("application(s) in progress","maombi yanaendelea"),"help"]].map(x=>`<button data-go="${x[1]}">${x[0]}</button>`).join("")};
$("#th").onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))=="dark";r.dataset.theme=d?"light":"dark";$("#th").textContent=d?"🌙":"☀️"};
$("#mo").onclick=()=>{const r=document.documentElement,off=r.dataset.motion=="off";r.dataset.motion=off?"on":"off";$("#mo").setAttribute("aria-pressed",off);toast(off?"Animations on.":"Animations off.")};
$("#lang").onclick=()=>{lang=lang=="en"?"sw":"en";render()};
render();
</script>
</body>
</html>
