<style>
:root{--navy:#0f2a4a;--navy2:#17406e;--green:#1f6b46;--gold:#c9a227;--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mut:#5d6877;--line:#e0e5ec;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1320;--card:#13233a;--ink:#e8edf4;--mut:#9aa8ba;--line:#26384f}}

*{box-sizing:inherit}html,body{margin:0}html{scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5rem}h1{font-size:2.3rem}h2{font-size:1.55rem}h3{font-size:1.1rem}
a{color:var(--green)}
.hd{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:3px solid var(--gold);flex-wrap:wrap}
.logo{display:flex;gap:10px;align-items:center;text-decoration:none;color:#fff}.logo i{font:700 1rem Georgia,serif;font-style:normal;width:38px;height:38px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center}
.logo b{display:block;font:700 1.15rem Georgia,serif;line-height:1}.logo small{font-size:.66rem;color:#b9c7da}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap;justify-content:center}nav a{color:#d6deea;text-decoration:none;padding:6px 10px;border-radius:99px;font-size:.88rem}
nav a:hover{background:rgba(255,255,255,.1)}nav a.on{background:var(--gold);color:#14202f;font-weight:700}
.rt{display:flex;gap:8px;align-items:center}.lang{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;font-size:.8rem}
.bg{display:none;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:6px 11px;font-size:1.1rem;margin-left:auto}
.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;border:0;padding:10px 20px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn.gold{background:var(--gold);color:#14202f}.btn.ghw{background:transparent;border:1px solid rgba(255,255,255,.5);padding:6px 14px;font-size:.85rem}.btn.out{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,#1b5a49);color:#fff;padding:64px 20px 56px;text-align:center}
.hero h1{color:#fff;max-width:760px;margin:0 auto .6rem}.hero p{max-width:640px;margin:0 auto 1.2rem;color:#d6deea}.hero .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hero .k{color:var(--gold);letter-spacing:.12em;font-size:.8rem;font-weight:700;margin-bottom:.8rem}
.wrap{max-width:1040px;margin:0 auto;padding:36px 18px}.wrap.nar{max-width:800px}
.ph{background:var(--navy);color:#fff;padding:34px 18px;border-bottom:3px solid var(--gold)}.ph div{max-width:1040px;margin:0 auto}.ph h1{color:#fff;margin:0;font-size:1.9rem}.ph p{margin:.3rem 0 0;color:#c5d1e2}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.card .ic{font-size:1.7rem}.card p{color:var(--mut);margin:.3rem 0 0;font-size:.94rem}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:-28px;position:relative;padding:0 18px;max-width:1040px;margin-left:auto;margin-right:auto}
.stats div{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:14px;text-align:center}.stats b{display:block;font:700 1.6rem Georgia,serif;color:var(--navy)}.stats span{font-size:.82rem;color:var(--mut)}
@media (prefers-color-scheme:dark){.stats b{color:#fff}}
.st{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:s}.st div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 16px 58px;position:relative}
.st div::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700}
.sec{margin-top:34px}.sec>h2{margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.92rem}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}th{background:var(--navy);color:#fff;font-size:.8rem}.ov{overflow-x:auto}
.note{background:rgba(201,162,39,.16);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;font-size:.9rem;margin:14px 0}
.band{background:var(--navy);color:#fff;text-align:center;padding:40px 18px}.band h2{color:#fff}.band p{color:#c5d1e2}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}summary{cursor:pointer;padding:12px 16px;font-weight:600;display:flex;gap:10px;justify-content:space-between}
summary small{color:var(--green);font-weight:700;white-space:nowrap}details div{padding:0 16px 14px;color:var(--ink)}details[open]{border-color:var(--gold)}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
footer{background:var(--navy);color:#b9c7da;text-align:center;padding:26px 18px;font-size:.85rem}footer .mo{color:var(--gold);font:italic 1rem Georgia,serif;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;border:1px solid var(--gold);z-index:99;max-width:90vw}
@media (max-width:860px){.bg{display:block}nav{display:none;width:100%;flex-direction:column;order:5}nav.open{display:flex}.rt{margin-left:auto}h1{font-size:1.8rem}.hero{padding:44px 16px}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;font:inherit;font-size:.86rem;cursor:pointer}.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tg{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.72rem;font-weight:700;background:rgba(201,162,39,.25);color:#7a5a00;margin-right:6px}.tg.g{background:rgba(31,107,70,.16);color:var(--green)}.tg.b{background:rgba(23,64,110,.14);color:var(--navy2)}
@media (prefers-color-scheme:dark){.tg{color:#e8c65a}.tg.g{color:#6fd3a0}.tg.b{color:#8fb8ee}}
.nw h3{margin:.4rem 0 .2rem}.nw a{font-size:.88rem}.sec>.more{margin-top:12px;display:inline-block}
nav a.lgn{background:var(--gold);color:#14202f;font-weight:700}nav a.lgn:hover{background:#d9b53a}
</style>

<script>
const $=s=>document.querySelector(s);let lang="en",tt;
const toast=t=>{document.querySelectorAll(".toast").forEach(e=>e.remove());document.body.insertAdjacentHTML("beforeend",`<div class="toast" role="status">${t}</div>`);clearTimeout(tt);tt=setTimeout(()=>document.querySelectorAll(".toast").forEach(e=>e.remove()),3200)};
const T={en:{home:"Home",about:"About Us",membership:"Membership",benefits:"Benefits",villages:"Villages",leadership:"Leadership",meetings:"Meetings",constitution:"Constitution",contact:"Contact",news:"Latest News",projects:"Our Projects",k:"MAPAWA DELEGATES WELFARE GROUP",sub:"A community welfare group standing with its members in bereavement, illness and education.",join:"Join MADEWEG",login:"Member / Admin Login",rd:"Read the constitution"},
sw:{home:"Nyumbani",about:"Kuhusu Sisi",membership:"Uanachama",benefits:"Msaada",villages:"Vijiji",leadership:"Uongozi",meetings:"Mikutano",constitution:"Katiba",contact:"Wasiliana",news:"Habari",projects:"Miradi",k:"KIKUNDI CHA USTAWI CHA WAJUMBE WA MAPAWA",sub:"Kikundi cha ustawi wa jamii kinachosimama na wanachama wake wakati wa msiba, ugonjwa na elimu.",join:"Jiunge na MADEWEG",login:"Ingia (Mwanachama / Msimamizi)",rd:"Soma katiba"}};
const VIL=[["Mapawa Centre","Five leaders are elected here, at least two of them women."],["Benesi","One chairman and two deputies."],["Mto Mkuu","One chairman and two deputies."],["Forozani","One chairman and two deputies."],["Jaribuni","One chairman and two deputies."]];
const CON=[
["Name and motto","","Mapawa Delegates Welfare Group (MADEWEG). Motto: Umoja Wetu, Maendeleo Yetu, Ustawi wa Jamii Yetu."],
["Who can join","","An applicant must be at least 18 and either live in one of the five recognised villages (Mapawa Centre, Benesi, Mto Mkuu, Forozani, Jaribuni) or have been born in Mapawa and its surrounding areas, even if living elsewhere."],
["Joining payments","","Registration fee KES 200 and an initial Hazina Fund contribution of KES 400. Neither is refundable."],
["Family and beneficiaries","","A member registers a spouse, parents, recognised guardians, children, next of kin and other recognised beneficiaries."],
["Late contributions","","A member who does not pay a required contribution within the set period, without an accepted reason, pays a fine of 25% of the expected contribution. For example, KES 200 becomes KES 250."],
["Three missed contributions","","Three consecutive missed contribution periods lead to a warning and a referral for review and a membership decision."],
["Reinstatement","Art. 6.8","A former member applies in writing and pays outstanding contributions, the applicable 25% penalty, the KES 200 registration fee and the KES 400 Hazina contribution. The committee must approve."],
["Funeral assistance","","KES 40,000 for the death of a member, a member’s spouse, a parent or recognised guardian, or a child older than six months. For a child from birth to six months, KES 20,000 (members give KES 100 each). Stillbirth is not covered. A parent recognised by several members: the KES 40,000 is shared equally. Once verified, payment comes from the existing Welfare Fund without waiting for contributions."],
["Medical assistance","Art. 7.2","Members are expected to be registered with SHA. MADEWEG gives 60% of the remaining hospital bill after SHA pays, where the qualifying expense is at least KES 10,000, subject to evidence, the group’s financial capacity and committee approval. Emergencies can get special consideration. Miscarriage and stillbirth are not covered; childbirth complications needing treatment may be."],
["Education support","","For academically outstanding students whose families cannot pay, assessed by the committee and subject to available funds."],
["Hazina Fund","","The emergency reserve. It is replenished by members after funds are released for qualifying disaster, illness or education support."],
["Banking controls","","Three signatories: Chairman, Secretary and Treasurer. Any withdrawal needs two approvals, and at least one must be the Chairman or Secretary."],
["Leadership","Art. 9.1","A 17-member committee: five executive officers (Chairman, Deputy Chairman, Secretary, Deputy Secretary, Treasurer) and twelve committee members."],
["Village representation","Art. 9.2","Each village except Mapawa Centre elects one chairman and two deputies. Mapawa Centre elects five leaders, at least two of them women. Every village has at least one woman leader."],
["Terms and elections","","Terms last three years. A leader may serve at most three consecutive terms in one position, then sits out one term. Elections are held every three years at the Annual General Meeting on 27 December."],
["Meetings","","Committee meetings at least every two months, general meetings every six months, and the Annual General Meeting on 27 December."],
["Quorum","Art. 9.6","The group is still clarifying how the quorum rule applies, because the figures in Articles 9.1 and 9.6 differ. Until then, quorum is confirmed manually."],
["Financial year","","28 December to 27 December of the following year."],
["Discipline","","Insults, threats, incitement, hostile language and repeated violations can lead to a warning, suspension or removal. A member must be heard before removal and may appeal."],
["Resignation","","A member gives at least 30 days’ written notice to the General Secretary and settles any debts and fines. The KES 200 and KES 400 are not refunded."],
["Disputes","","Dispute goes to the leadership committee, which hears all parties and decides. A party may appeal to the General Meeting, and then use legal avenues if internal resolution fails."],
["Amendments","Art. 10","Considered each year. Members send proposals to the Executive Committee, which discusses them. They then go to members for discussion and feedback before adoption."]];
const NEWS=[["Meetings","Notice","Annual General Meeting: 27 December","The AGM is held every year on 27 December and closes the financial year (28 December to 27 December). Leadership elections take place at the AGM every three years."],["Meetings","Notice","Committee meeting","Committee meetings are held at least once every two months. The Secretary will confirm the date and venue."],["Welfare","Update","How funeral support is paid","Once a death is verified, the benefit is paid from the existing Welfare Fund without waiting for members’ contributions. Contributions are collected for one month afterwards and stay in the Welfare Fund."],["Members","Reminder","Keep your contributions up to date","A contribution not paid by its deadline, without an accepted reason, attracts a 25% fine. Members can pay by M-Pesa from their account."],["Governance","Notice","Constitutional amendment proposals","Each year members may send proposals to the Executive Committee, which discusses them before they go to members for feedback."]];
const PRG=[["🕊️","Funeral welfare","KES 40,000 for the death of a member or covered family member, with a smaller benefit for infants."],["🩺","Medical assistance","60% of the remaining hospital bill after SHA, for qualifying bills of KES 10,000 or more."],["🎓","Education support","Help for outstanding students whose families cannot meet the costs."],["🏦","Hazina Fund","The group’s emergency reserve, replenished by members after it is used."]];
const nc=n=>`<div class="card nw"><span class="tg">Sample</span><span class="tg b">${n[0]}</span><h3>${n[2]}</h3><p>${n[3]}</p></div>`;
const hd=(t,p)=>`<div class="ph"><div><h1>${t}</h1><p>${p}</p></div></div>`;
const P={
home:()=>{const t=T[lang];return`<section class="hero"><p class="k">${t.k}</p><h1>Umoja Wetu, Maendeleo Yetu, Ustawi wa Jamii Yetu</h1><p>${t.sub}</p><div class="btns"><a class="btn gold" href="#membership">${t.join}</a><a class="btn out" href="#constitution">${t.rd}</a></div></section>
<div class="stats"><div><b>5</b><span>Villages</span></div><div><b>17</b><span>Committee members</span></div><div><b>KES 40,000</b><span>Funeral benefit</span></div><div><b>27 Dec</b><span>Annual General Meeting</span></div></div>
<div class="wrap"><h2>How we stand with members</h2><div class="g"><div class="card"><div class="ic">🕊️</div><h3>Funeral support</h3><p>KES 40,000 for the death of a member or a covered family member, paid from the Welfare Fund once verified.</p></div><div class="card"><div class="ic">🩺</div><h3>Medical assistance</h3><p>60% of the remaining hospital bill after SHA, for qualifying bills of KES 10,000 or more.</p></div><div class="card"><div class="ic">🎓</div><h3>Education support</h3><p>Help for outstanding students whose families cannot meet the costs, assessed by the committee.</p></div></div>
<div class="sec"><h2>Becoming a member</h2><div class="st"><div><b>Check you qualify</b><br>18 or over, living in or born in the Mapawa area.</div><div><b>Register</b><br>Fill in the form and add your family.</div><div><b>Pay KES 600</b><br>KES 200 fee and KES 400 Hazina.</div><div><b>Get approved</b><br>Membership starts after review.</div></div></div>
<div class="sec"><h2>Latest news</h2><div class="g">${NEWS.slice(0,3).map(nc).join("")}</div><a class="more" href="#news">All news →</a></div><div class="sec"><h2>Our projects</h2><div class="g">${PRG.map(p=>`<div class="card"><div class="ic">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p></div>`).join("")}</div><a class="more" href="#projects">All projects →</a></div></div>
<section class="band"><h2>Already a member?</h2><p>Sign in to see your card, payments and family cover, or to apply for support.</p><a class="btn gold" href="Member_admin_login.html">${t.login}</a></section>`},
about:()=>hd("About Us","Mapawa Delegates Welfare Group")+`<div class="wrap nar"><p>MADEWEG, the Mapawa Delegates Welfare Group, is a community welfare group for people of Mapawa and its surrounding areas. Members pool contributions so that families are supported at the hardest moments: a death, a serious illness, or a child who cannot pay school fees.</p><div class="note"><b>Our motto.</b> <i>Umoja Wetu, Maendeleo Yetu, Ustawi wa Jamii Yetu</i>: Our unity, our development, our community’s welfare.</div>
<h2>How we are run</h2><p>The group is led by a 17-member committee, elected every three years. Money is kept in two separate funds, the Hazina Fund (emergency reserve) and the Welfare Fund. Bank withdrawals need two of the three signatories, and one must be the Chairman or Secretary.</p>
<h2>Our values</h2><div class="g"><div class="card"><h3>Unity</h3><p>Every member contributes and every member is covered.</p></div><div class="card"><h3>Accountability</h3><p>Decisions, payments and elections are recorded.</p></div><div class="card"><h3>Fairness</h3><p>Members are heard before any disciplinary decision.</p></div></div></div>`,
membership:()=>hd("Membership","Who can join, what it costs and how it works")+`<div class="wrap nar"><h2>Who can join</h2><p>You must be at least 18 years old, and either live in one of our five villages or have been born in Mapawa and its surrounding areas, even if you live elsewhere now.</p>
<h2>What it costs</h2><div class="ov"><table><tr><th>Payment</th><th>Amount</th><th>Refundable?</th></tr><tr><td>Registration fee</td><td>KES 200</td><td>No</td></tr><tr><td>Hazina Fund initial contribution</td><td>KES 400</td><td>No</td></tr><tr><td>Late contribution fine</td><td>25% of the contribution</td><td>Only if disputed and accepted</td></tr></table></div>
<h2 style="margin-top:22px">What you will need</h2><p>National ID, plus IDs of your spouse, parents or guardians and next of kin, and birth certificates for your children.</p>
<h2>Leaving or returning</h2><p>To leave, give 30 days’ written notice to the General Secretary and settle any debts. To return, apply in writing and pay what is outstanding, the 25% penalty, KES 200 and KES 400, with committee approval (Article 6.8).</p><p><a class="btn" href="https://claude.ai/artifact/By7twS7kywqvonCMDBtYZb#register" target="_blank" rel="noopener">Register now</a></p></div>`,
benefits:()=>hd("Benefits","Support for funerals, medical bills and education")+`<div class="wrap"><h2>Funeral assistance</h2><div class="ov"><table><tr><th>Who died</th><th>Benefit</th><th>Member levy</th></tr><tr><td>Member, spouse, parent or guardian</td><td>KES 40,000</td><td>Paid from the Welfare Fund first</td></tr><tr><td>Child older than six months</td><td>KES 40,000</td><td>KES 200 each</td></tr><tr><td>Child up to six months</td><td>KES 20,000</td><td>KES 100 each</td></tr><tr><td>Stillbirth</td><td>Not covered</td><td>None</td></tr></table></div>
<p>For a member’s death, the benefit goes to the registered next of kin. If several members recognise the same parent, the KES 40,000 is shared equally.</p>
<div class="sec"><h2>Medical assistance (Article 7.2)</h2><p>MADEWEG pays 60% of the remaining bill after SHA, for qualifying bills of at least KES 10,000. You must be an active member who has paid the latest two contribution periods and owes nothing. The final amount depends on the Welfare Fund and committee approval. Emergencies can get special consideration. Example: a KES 100,000 bill, SHA pays KES 60,000, the remaining KES 40,000 gives an indicative KES 24,000.</p></div>
<div class="sec"><h2>Education support</h2><p>For academically outstanding students whose families cannot pay. The committee assesses each case against available funds; high marks alone do not guarantee support, and partial support is possible.</p></div></div>`,
villages:()=>hd("Villages","Five villages, one group")+`<div class="wrap"><div class="g">${VIL.map(v=>`<div class="card"><div class="ic">🏘️</div><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join("")}</div><div class="note">Every village must have at least one woman leader, and Mapawa Centre at least two of its five.</div></div>`,
leadership:()=>hd("Leadership","A 17-member committee elected every three years")+`<div class="wrap"><h2>Executive Committee</h2><div class="g">${[["Chairman","Chairs meetings, supervises decisions, represents MADEWEG and oversees constitutional compliance."],["Deputy Chairman","Assists the Chairman and acts for the Chairman when needed."],["Secretary","Keeps official records, prepares minutes and records decisions."],["Deputy Secretary","Assists the Secretary and acts in the Secretary’s absence."],["Treasurer","Keeps the financial records and reports. Cannot authorise a withdrawal alone."]].map(r=>`<div class="card"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("")}</div>
<div class="sec"><h2>Committee members</h2><p>Twelve more members take part in meetings, monitor decisions and carry out assigned duties. Terms last three years, with a limit of three consecutive terms in one position. Names will be published here once the group confirms them.</p></div></div>`,
meetings:()=>hd("Meetings and Events","When the group meets")+`<div class="wrap nar"><div class="ov"><table><tr><th>Meeting</th><th>When</th></tr><tr><td>Committee meetings</td><td>At least every two months</td></tr><tr><td>General meetings</td><td>Every six months</td></tr><tr><td>Annual General Meeting</td><td>27 December</td></tr><tr><td>Leadership elections</td><td>Every three years, at the AGM</td></tr></table></div><div class="note">The financial year runs from 28 December to 27 December. Notices and minutes are available to members after signing in.</div></div>`,
constitution:()=>hd("Constitution","Katiba Mpya 2026: key provisions in plain language")+`<div class="wrap nar"><div class="note">This is a plain-language summary of the key rules, not the official text. The signed constitution file is still to be uploaded by the group.</div><label for="cs">Search the constitution</label><input id="cs" type="search" placeholder="for example funeral, fine, election"><p style="margin:10px 0"><button class="btn" id="dl">Download official constitution (PDF)</button></p><div id="cl"></div></div>`,
news:()=>hd("Latest News","Notices and updates from the group")+`<div class="wrap nar"><div class="note">These are sample items based on the constitution. Replace them with your real announcements.</div><div class="chips" id="ch"></div><div id="nl"></div></div>`,
projects:()=>hd("Our Projects","What the group does for its members and community")+`<div class="wrap"><h2>Ongoing welfare programmes</h2><div class="g">${PRG.map(p=>`<div class="card"><div class="ic">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p></div>`).join("")}</div>
<div class="sec"><h2>Community development projects</h2><div class="note">Sample cards only. The group should add its real projects, with their status.</div><div class="g">${[["Planned","b","Community project: add title","Describe the goal, the village and the expected benefit."],["Ongoing","g","Community project: add title","Describe progress and how members can help."],["Completed","","Community project: add title","Describe what was achieved and who benefited."]].map(c=>`<div class="card"><span class="tg">Sample</span><span class="tg ${c[1]}">${c[0]}</span><h3>${c[2]}</h3><p>${c[3]}</p></div>`).join("")}</div></div></div>`,
contact:()=>hd("Contact","Send a message to the group")+`<div class="wrap nar"><form id="cf"><label for="n">Your name</label><input id="n" required><label for="p">Phone number</label><input id="p" type="tel" required><label for="m">Message</label><textarea id="m" rows="5" required></textarea><p><button class="btn">Send message</button></p></form><div class="note">Office phone, email and meeting venue will be added once the group provides them. Members can also use the member portal to send suggestions and complaints.</div></div>`};
P.constitution.init=()=>{const f=()=>{const q=($("#cs").value||"").toLowerCase();const r=CON.filter(c=>(c[0]+c[2]).toLowerCase().includes(q));$("#cl").innerHTML=r.map(c=>`<details><summary><span>${c[0]}</span>${c[1]?`<small>${c[1]}</small>`:""}</summary><div>${c[2]}</div></details>`).join("")||"<p>No provision matches. Try another word.</p>"};$("#cs").oninput=f;f();$("#dl").onclick=()=>toast("The official PDF has not been uploaded yet.")};
P.news.init=()=>{let c="All";const cs=["All",...new Set(NEWS.map(n=>n[0]))],f=()=>{$("#ch").innerHTML=cs.map(x=>`<button class="chip" aria-pressed="${x==c}" data-c="${x}">${x}</button>`).join("");$("#nl").innerHTML=NEWS.filter(n=>c=="All"||n[0]==c).map(n=>`<div class="card nw" style="margin-bottom:12px"><span class="tg">Sample</span><span class="tg b">${n[0]}</span><span class="tg g">${n[1]}</span><h3>${n[2]}</h3><p>${n[3]}</p></div>`).join("")};$("#ch").onclick=e=>{const b=e.target.closest("[data-c]");if(b){c=b.dataset.c;f()}};f()};
P.contact.init=()=>$("#cf").onsubmit=e=>{e.preventDefault();e.target.reset();toast("Thank you. Your message would be sent to the Secretary.")};
const K=["home","about","membership","benefits","projects","news","villages","leadership","meetings","constitution","contact"];
function render(){const h=location.hash.slice(1),k=P[h]?h:"home";$("#nav").innerHTML=K.map(x=>`<a href="#${x}" class="${x==k?"on":""}">${T[lang][x]}</a>`).join("")+`<a href="Member_admin_login.html" class="lgn">${T[lang].login}</a>`;$("#lang").textContent=lang=="en"?"SW":"EN";
$("#v").innerHTML=P[k]();P[k].init&&P[k].init();$("#nav").classList.remove("open");$("#bg").setAttribute("aria-expanded","false");document.title="MADEWEG · "+T.en[k];scrollTo(0,0)}
addEventListener("hashchange",render);$("#lang").onclick=()=>{lang=lang=="en"?"sw":"en";render()};$("#bg").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o)};render();
</script>
</body>
