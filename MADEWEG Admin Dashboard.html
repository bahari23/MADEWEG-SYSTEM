<!DOCTYPE html>
<html lang="en">
<head>

<title>MADEWEG Admin Dashboard (Prototype)</title>
<style>

*{box-sizing:inherit}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.app{display:flex;min-height:100vh}
aside{width:228px;flex:none;background:var(--nav);color:#d3dcea;position:sticky;top:0;height:100vh;overflow:auto;padding:12px 8px}

.main{flex:1;min-width:0;padding:0 16px 16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0}

.flt{display:flex;gap:8px;flex-wrap:wrap}
select,input,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.btn{background:var(--green);color:#fff;border:0;padding:7px 13px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
.btn.gh{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:4px 10px;font-size:.78rem}.btn.bl{background:#1b6fe0}.btn.rd{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}

.k{border-radius:12px;padding:13px 14px;color:#fff;position:relative;min-height:92px}

.c1{background:linear-gradient(135deg,#1457b8,#0e3b82)}.c2{background:linear-gradient(135deg,#1f9d62,#14714a)}.c3{background:linear-gradient(135deg,#d8a516,#b4820a)}.c4{background:linear-gradient(135deg,#17a5a5,#0f7a8a)}.c5{background:linear-gradient(135deg,#7a4fd0,#5530a8)}.c6{background:linear-gradient(135deg,#e5733a,#c0392b)}
.s{border-radius:12px;padding:13px;display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-top:3px solid;background:var(--card)}
.s i{font-style:normal;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;color:#fff;flex:none}.s b{font:700 1.5rem Georgia,serif;display:block;line-height:1.1}.s span{font-size:.78rem;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ch h2{margin:0}.ch a{font-size:.78rem;color:#1b6fe0;cursor:pointer}
.cols{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:8px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.66rem;color:var(--mut)}
.cols div i{display:block;width:100%;max-width:34px;background:#3b8df0;border-radius:4px 4px 0 0;min-height:2px}.cols div:nth-child(even) i{background:var(--green)}
.hb{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:.83rem}.hb em{width:98px;font-style:normal;flex:none}.hb span{flex:1;height:9px;background:var(--bg);border-radius:9px;overflow:hidden}.hb span i{display:block;height:100%;border-radius:9px}.hb b{width:28px;text-align:right}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn .r{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none}.dn .r span{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font:700 .8rem Georgia,serif;line-height:1.1}
.lg{font-size:.8rem;flex:1;min-width:130px}.lg div{display:flex;gap:6px;align-items:center;margin:3px 0}.lg i{width:10px;height:10px;border-radius:50%;flex:none}.lg b{margin-left:auto}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{border:0;border-radius:10px;color:#fff;padding:12px 4px;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}.qa button b{font-size:1.3rem}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:.7rem;text-transform:uppercase}.n{text-align:right}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.72rem;font-weight:700}.t-g{background:rgba(31,107,70,.16);color:var(--green)}.t-y{background:rgba(201,162,39,.26);color:#7a5a00}.t-r{background:rgba(192,57,43,.15);color:var(--bad)}
@media (prefers-color-scheme:dark){.t-g{color:#6fd3a0}.t-y{color:#e8c65a}.t-r{color:#ff9a92}}
.fr{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.fr .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.fr small{color:var(--mut)}
.sg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.sg span{font-size:.72rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.sg span.y{background:var(--green);color:#fff;border-color:var(--green)}
.nt{border-left:3px solid var(--gold);padding:2px 10px;margin:8px 0}.nt small{color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:.75rem;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:8px;border:1px solid var(--gold);z-index:99;max-width:90vw}
@media (max-width:860px){aside{position:fixed;z-index:50;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 16px rgba(0,0,0,.35)}aside.open{transform:none}.burger{display:inline-block}.qa{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
.fg{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fg label,.fg .fs{display:block}.fs{grid-column:1/-1;font:700 .85rem Georgia,serif;margin:8px 0 0;color:var(--mut)}
.fg label{font-size:.78rem;color:var(--mut)}.fg input,.fg select,.fg textarea{width:100%;margin-top:3px;color:var(--ink)}
.ck{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.ck label{display:flex;gap:4px;align-items:center;color:var(--ink)}.ck input{width:auto;margin:0}
.cf{display:flex;gap:8px;align-items:flex-start;margin:12px 0 4px;font-size:.82rem}.cf input{margin-top:3px}
.nn{background:rgba(201,162,39,.14);border-left:4px solid var(--gold);padding:7px 11px;border-radius:6px;font-size:.82rem;margin-bottom:10px}.nn:empty{display:none}.nn.bad,.msg.bad{background:rgba(192,57,43,.12);border-color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:8px}.msg{margin-top:8px;font-size:.85rem}.msg:not(:empty){padding:8px 11px;border-left:4px solid var(--green);background:var(--bg);border-radius:6px}
.tools{display:flex;gap:8px;position:relative}.ib{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer}
.ib kbd{font-size:.68rem;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}.ib b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:99px;font-size:.66rem;padding:0 6px}
#bp{position:absolute;top:44px;right:0;width:270px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}#bp button,#cr button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:6px;color:var(--ink);font:inherit;cursor:pointer}#bp button:hover,#cr button:hover{background:var(--bg)}
.bd{background:var(--bad);color:#fff;border-radius:99px;font-size:.68rem;padding:0 7px;margin-left:auto;font-style:normal}
dialog#cp{border:2px solid var(--gold);border-radius:12px;width:min(480px,92vw);padding:12px;background:var(--card);color:var(--ink);margin-top:10vh}dialog::backdrop{background:rgba(0,0,0,.5)}#cq{width:100%;margin-bottom:8px}
.inb{display:grid;gap:12px;grid-template-columns:minmax(280px,.9fr) 1.4fr;align-items:start}@media (max-width:860px){.inb{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 11px;font:inherit;font-size:.78rem;cursor:pointer}.chip[aria-pressed="true"]{background:var(--nav);color:#fff}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;margin:6px 0}.eq{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px;margin-bottom:8px;font:inherit;font-size:.84rem;cursor:pointer}.eq.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.3)}.eq .tag{float:right}
.th,.ph2{display:flex;flex-direction:column;gap:8px;margin:10px 0}.bb{max-width:85%;padding:9px 12px;border-radius:12px;font-size:.88rem;background:var(--bg)}.bb.a{align-self:flex-end;background:#1b6fe0;color:#fff}
#qr{width:100%;margin:6px 0}.sub{font-size:.76rem;color:var(--mut);margin:6px 0 0}.rc b{font:700 2rem Georgia,serif;color:var(--green)}.rc span{color:var(--mut)}
.msg.bad{background:rgba(192,57,43,.12);border-color:var(--bad)}
.tl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.tl:last-child{border:0}.dot{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none;font-size:.9rem}.tl small{color:var(--mut)}
.cols div span{font-size:.68rem;color:var(--ink);margin-bottom:2px}.card a[data-go]{cursor:pointer}
.mx{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}.mx small{color:var(--mut)}
.seg2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg2 button{border:0;background:var(--card);color:var(--ink);padding:5px 11px;font:inherit;font-size:.78rem;cursor:pointer}.seg2 button[aria-pressed="true"]{background:var(--nav);color:#fff}
.pvp{background:rgba(201,162,39,.2);border:1px solid var(--gold);border-radius:8px;padding:5px 10px;font-size:.8rem}.pvp[hidden]{display:none}
button:disabled{opacity:.45;cursor:not-allowed}.ib[aria-pressed="false"]{opacity:.55}
aside a,.card,.k,.s,.btn,.eq,.chip{transition:transform .18s,box-shadow .18s,background .15s,border-color .15s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.55) rotate(-100deg)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bub{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)}}@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
html:not([data-motion="off"]) #v>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
html:not([data-motion="off"]) #v .card,html:not([data-motion="off"]) #v .k,html:not([data-motion="off"]) #v .s{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
html:not([data-motion="off"]) .cols div i{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + .2s)}
html:not([data-motion="off"]) .hb span i{transform-origin:left;animation:growx 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*90ms + .2s)}
html:not([data-motion="off"]) .dn .r{animation:pop .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:.2s}
html:not([data-motion="off"]) svg .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards}html:not([data-motion="off"]) svg .pt{animation:fade .5s 1.2s both}
html:not([data-motion="off"]) .tl,html:not([data-motion="off"]) .eq{animation:up .45s both;animation-delay:calc(var(--i,0)*50ms)}html:not([data-motion="off"]) .bb{animation:bub .4s both;animation-delay:calc(var(--i,0)*90ms)}
html:not([data-motion="off"]) .ib b,html:not([data-motion="off"]) .bd{animation:pulse 2s infinite}
html:not([data-motion="off"]) .k::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);background-size:200% 100%;animation:shine 3.5s ease-in-out 1;pointer-events:none}
.card:hover,.k:hover,.s:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(15,42,74,.16)}aside a:hover{transform:translateX(3px)}.btn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside id="sb" aria-label="Main navigation"></aside>
<div class="main">
<header class="top"><button class="burger" id="bg" aria-label="Open menu">☰</button>
<div><h1>Dashboard</h1><p>Welcome back, Super Administrator · <span id="dt"></span></p></div>
<div id="pv" class="pvp" hidden></div><div class="tools"><button class="ib" id="sq" aria-label="Search">🔍 Search<kbd>Ctrl K</kbd></button><button class="ib" id="bell" aria-label="Notifications">🔔<b id="bc">0</b></button><button class="ib" id="mo" aria-label="Toggle animations" aria-pressed="true">✨</button><button class="ib" id="th" aria-label="Toggle dark mode">🌙</button><div id="bp" hidden></div></div><div class="flt"><select id="fv" aria-label="Village"></select><select id="fy" aria-label="Financial year"><option>FY 2026 (28 Dec 2025 – 27 Dec 2026)</option><option>FY 2025</option></select><select id="fr" aria-label="Acting as"><option>Super Administrator</option><option>Chairman</option><option>Secretary</option><option>Treasurer</option><option>Deputy Chairman</option><option>Deputy Secretary</option><option>Committee Member</option><option>Village Chairman</option><option>Village Deputy</option><option>Auditor</option><option>Election Officer</option><option>Welfare Officer</option></select><button class="btn gh" id="rs">Reset</button></div></header>
<div id="v"></div>
<footer>MADEWEG · Prototype with sample data, nothing is saved or paid · Data as of 12 Nov 2026</footer>
<dialog id="cp" aria-label="Quick search"><input id="cq" placeholder="Jump to a screen, member or enquiry…" aria-label="Quick search"><div id="cr"></div></dialog>
</div></div>
<script>
const $=s=>document.querySelector(s),kes=n=>"KES "+Math.round(n).toLocaleString("en-KE");
let tt;const toast=t=>{document.querySelectorAll(".toast").forEach(e=>e.remove());document.body.insertAdjacentHTML("beforeend",`<div class="toast" role="status">${t}</div>`);clearTimeout(tt);tt=setTimeout(()=>document.querySelectorAll(".toast").forEach(e=>e.remove()),3200)};
const GO={"New member":"Registration","Contribution request":"Contributions","Record funeral":"Funeral Welfare","Medical claim":"Medical Welfare","Education case":"Education Support","Schedule meeting":"Meetings","Post notice":"Notifications","Export report":"Reports"};
const VIL=["Mapawa Centre","Benesi","Mto Mkuu","Forozani","Jaribuni"];
const D={members:[84,52,41,37,34],active:[72,44,35,32,28],owed:[14200,9800,7600,5400,4250],coll:[62000,41000,33500,27500,23300],fines:[6,4,3,2,1]};
const S={v:"All villages",
apps:[["APP-0031","Peter Mwatela","Forozani","Complete"],["APP-0032","Grace Njeri","Benesi","Missing: spouse ID"],["APP-0033","Said Omar","Jaribuni","Complete"],["APP-0034","Lucy Achieng","Mapawa Centre","Complete"]],
fin:[{id:"WD-0007",w:"Medical support MED-0007",a:24000,f:"Welfare Fund",s:[],done:0},{id:"WD-0008",w:"Funeral benefit FUN-0005",a:40000,f:"Welfare Fund",s:["Secretary"],done:0},{id:"WD-0009",w:"Education support EDU-0002",a:15000,f:"Welfare Fund",s:["Treasurer"],done:0}]};
const DEF=[["Hassan Mbaruk","Mapawa Centre",600,2],["Neema Said","Mto Mkuu",450,3],["Juma Kombo","Benesi",250,1],["Omar Salim","Forozani",400,2],["Rehema Kazungu","Jaribuni",250,1],["Bakari Mwanza","Mapawa Centre",800,3]];
const PAY=[["R-0412","Amina Mwakio","Funeral levy",200],["R-0411","Peter Mwatela","Registration + Hazina",600],["R-0410","Fatuma Ali","Medical levy",200],["R-0409","Juma Kombo","Fine (25%)",50]];
const MON=[9.2,11.5,10.1,12.8,9.9,13.4,12.1,14.6,11.7,15.2,13.1],ML="JFMAMJJASON";
const NAV=[["MAIN",[["📊","Dashboard","on"],["🕘","Activity Feed"],["⚖️","Compliance Tracker","gr"]]],["MEMBERS",[["📝","Registration"],["👥","All Members"],["🏘️","Villages"],["🔁","Reinstatements"]]],["COMMUNICATION",[["📨","Bulk Messages"],["💬","Member Enquiries"]]],["MONEY",[["📊","Fund Accounts","gr"],["💳","Contributions"],["📲","Payments (M-Pesa)"],["🏦","Hazina Fund"],["🤲","Welfare Fund"],["🧾","Finance and Approvals"],["⚠️","Fines","rd"]]],["WELFARE",[["🕊️","Funeral Welfare"],["🩺","Medical Welfare"],["🎓","Education Support"],["🧑‍🎓","Students"]]],["GOVERNANCE",[["🏛️","Leadership"],["📅","Meetings"],["🗳️","Elections"],["⚖️","Discipline"],["🤝","Disputes"]]],["RECORDS",[["📁","Documents"],["📈","Reports"],["🔍","Audit Logs"],["🔔","Notifications"]]],["ADMIN",[["🔐","User Management","gr"],["⚙️","Settings"],["📜","Constitutional Register","gr"],["🚪","Sign out","rd"]]]];
const sel=()=>S.v=="All villages"?[0,1,2,3,4]:[VIL.indexOf(S.v)];
const sum=a=>sel().reduce((t,i)=>t+a[i],0);
const donut=(p,c)=>{let a=0;const g=p.map(x=>{const s=a;a+=x[0];return `${x[2]} ${s}% ${a}%`}).join(",");return `<div class="dn"><div class="r" style="background:conic-gradient(${g})"><span>${c}</span></div><div class="lg">${p.map(x=>`<div><i style="background:${x[2]}"></i>${x[1]}<b>${x[0]}%</b></div>`).join("")}</div></div>`};
const valid=f=>f.s.length>=2&&(f.s.includes("Chairman")||f.s.includes("Secretary"));

$("#sb").innerHTML=`<div class="br"><i>MD</i><div><b>MADEWEG</b><small>Management System</small></div></div>`+NAV.map(([h,l])=>`<h4>${h}</h4>`+l.map(x=>`<a class="${x[2]||""}" data-n="${x[1]}" tabindex="0"><span aria-hidden="true">${x[0]}</span>${x[1]}${x[1]=="Member Enquiries"?`<em class="bd" id="bdq"></em>`:""}</a>`).join("")).join("");

<div class="card" style="margin-top:12px"><h2>Invite a leader</h2><form id="uf" class="fg"><label>Full name<input name="n" required></label><label>Email<input name="e" type="email" required></label><label>Phone<input name="p" type="tel" required></label><label>Role<select name="r" required><option value="">Choose…</option>${ADMR.map(r=>`<option>${r}</option>`).join("")}</select></label><label>Village (village roles)<select name="v"><option value="">–</option>${VIL.map(v=>`<option>${v}</option>`).join("")}</select></label><div class="acts" style="grid-column:1/-1"><button class="btn">Send invitation</button></div></form><div class="msg" id="um" role="status"></div><p class="sub">Leaders with finance or administrative powers must set up two-step sign-in before they can use the system.</p></div>`;
if(ut=="Access control"){const u=USERS.find(x=>x.id==us);stg=stg&&stg.id==us?stg:{id:us,m:lvl(u)};const df=ALL.filter(n=>stg.m[n]!=base(u.role,n));
B.innerHTML=`<div class="card"><div class="row2" style="grid-template-columns:1fr auto"><select id="us2" aria-label="User">${USERS.map(x=>`<option value="${x.id}"${x.id==us?" selected":""}>${esc(x.n)} (${x.role})</option>`).join("")}</select><button class="btn gh sm" id="ur">Reset to role defaults</button></div><p class="sub">Choose what this leader can see and change. Anything different from the role default needs an authorising resolution.</p>
${Object.entries(GRP).map(([g,l])=>`<h3 class="fs">${g}</h3>${l.map(n=>`<div class="mx"><span>${n}${stg.m[n]!=base(u.role,n)?` <span class="tag t-y">changed</span>`:""}</span><small>Default: ${base(u.role,n)}</small><div class="seg2">${LV.map(x=>`<button data-n="${n}" data-l="${x}" aria-pressed="${stg.m[n]==x}">${x=="none"?"Hidden":x=="view"?"View":"Edit"}</button>`).join("")}</div></div>`).join("")}`).join("")}
<div class="fg" style="margin-top:12px"><label>Authorising resolution or decision reference<input id="ures"></label><label>Reason<input id="ureas"></label></div><div class="msg" id="um" role="status"></div><div class="acts"><button class="btn" id="usv">Save access (${df.length} change${df.length==1?"":"s"})</button></div></div>`}
if(ut=="Roles")B.innerHTML=`<div class="card">${tb(["Role","Main access","Can view","Can edit","Users"],Object.entries(RD).map(([r,d])=>[r,d[2],new Set([...d[0],...d[1]]).size+" screens",d[1].length+" screens",USERS.filter(u=>u.role==r).length]))}<p class="sub">Role defaults follow the constitution: auditors read-only, the Treasurer cannot approve alone, village leaders have no medical access, and only the Chairman, Secretary and Treasurer sign withdrawals.</p></div>`};
$("#ut").onclick=e=>{const b=e.target.closest("[data-t]");if(b){ut=b.dataset.t;draw()}};
$("#ub").onclick=e=>{const b=e.target.closest("button");if(!b)return;const um=t=>{const m=$("#um");if(m){m.className="msg bad";m.textContent=t}};
if(b.dataset.a=="acc"){us=b.dataset.u;ut="Access control";stg=null;return draw()}
if(b.dataset.a=="pre"){const u=USERS.find(x=>x.id==b.dataset.u);if(u.st=="Suspended")return toast("This user is suspended.");CURU=u;$("#fr").value=u.role;pv();applyAccess();return openScreen("Dashboard")}
if(b.dataset.a=="sus"){const u=USERS.find(x=>x.id==b.dataset.u);if(u.st=="Suspended"){u.st="Active";AUD.unshift([now(),role(),"Reactivated user "+u.n,"USR"]);draw();return toast("User activated.")}return askReason("Reason for suspending "+u.n,()=>{u.st="Suspended";draw();toast("User suspended. Sessions are ended.")})}
if(b.dataset.l){stg.m[b.dataset.n]=b.dataset.l;return draw()}
if(b.id=="ur"){stg=null;return draw()}
if(b.id=="usv"){const u=USERS.find(x=>x.id==us),df=ALL.filter(n=>stg.m[n]!=base(u.role,n)),r=$("#ures").value.trim();
if(!df.length)return um("No changes to save.");
if(u.role=="Ordinary Member")return um("Ordinary members have no admin access.");
const bad=[];df.forEach(n=>{const l=stg.m[n];if(u.role=="Auditor"&&l=="edit")bad.push("Auditors are read-only ("+n+").");if(n=="Finance and Approvals"&&l=="edit"&&!["Chairman","Secretary","Treasurer"].includes(u.role))bad.push("Only the Chairman, Secretary and Treasurer sign withdrawals.");if(["Settings","User Management"].includes(n)&&l!="none"&&u.role!="Super Administrator")bad.push(n+" is for the Super Administrator only.")});
if(bad.length)return um(bad[0]);if(!r)return um("Enter the authorising resolution or decision reference.");
u.ov={};df.forEach(n=>u.ov[n]=stg.m[n]);u.auth=r;AUD.unshift([now(),role(),"Changed access for "+u.n+": "+df.map(n=>n+" "+base(u.role,n)+"→"+stg.m[n]).join("; ").slice(0,110)+" ["+r.slice(0,30)+"]",u.id]);stg=null;if(CURU&&CURU.id==u.id)applyAccess();draw();toast("Access saved and recorded in the audit log.")}};
$("#ub").addEventListener("change",e=>{if(e.target.id=="us2"){us=e.target.value;stg=null;draw()}});
$("#ub").addEventListener("submit",e=>{if(e.target.id!="uf")return;e.preventDefault();const f=new FormData(e.target),m=$("#um"),bad=t=>{m.className="msg bad";m.textContent=t};
if(!/^(07|01)\d{8}$/.test(f.get("p")))return bad("Enter a valid 10-digit phone number.");if(USERS.some(u=>u.n==f.get("n")))return bad("A user with this name already exists.");if(/Village/.test(f.get("r"))&&!f.get("v"))return bad("Choose the village for a village role.");
const u={id:"USR-"+String(USERS.length+1).padStart(3,"0"),n:f.get("n"),role:f.get("r"),v:f.get("v")||"–",st:"Invited",mfa:0,last:"Never",ov:{}};USERS.push(u);AUD.unshift([now(),role(),"Invited user "+u.n+" as "+u.role,u.id]);draw();toast("Invitation sent by email and SMS.")});
draw()}};
function pv(){const p=$("#pv");p.hidden=!CURU;p.innerHTML=CURU?`Previewing as <b>${esc(CURU.n)}</b> (${CURU.role}) <button class="btn sm" id="pvs">Stop</button>`:"";const s=$("#pvs");if(s)s.onclick=()=>{CURU=null;$("#fr").value="Super Administrator";pv();applyAccess();openScreen("Dashboard")}}
function applyAccess(){document.querySelectorAll("#sb a").forEach(a=>{const n=a.dataset.n;a.style.display=n=="Dashboard"||n=="Sign out"||acc(n)!="none"?"":"none"});document.querySelectorAll("#sb h4").forEach(h=>{let e=h.nextElementSibling,y=0;while(e&&e.tagName=="A"){if(e.style.display!="none")y=1;e=e.nextElementSibling}h.style.display=y?"":"none"})}
function lockUI(n){const v=$("#v"),dis=x=>{x.disabled=true;x.title="Read-only for your role"};
if(n=="Dashboard"){v.querySelectorAll('[data-a="ok"],[data-a="no"],[data-a="doc"]').forEach(x=>acc("Registration")!="edit"&&dis(x));v.querySelectorAll('[data-a="sign"],[data-a="exec"]').forEach(x=>acc("Finance and Approvals")!="edit"&&dis(x));v.querySelectorAll('[data-a="stk"]').forEach(x=>acc("Payments (M-Pesa)")!="edit"&&dis(x));return}
if(acc(n)=="view"){v.insertAdjacentHTML("afterbegin",`<div class="nn">Read-only: your role can view this screen but not change it.</div>`);v.querySelectorAll("form :is(input,select,textarea,button),[data-e]").forEach(dis)}}
/* animation */
const mOff=()=>document.documentElement.dataset.motion=="off"||matchMedia("(prefers-reduced-motion:reduce)").matches;
function anim(){document.querySelectorAll("#v .cols div,#v .hb,#v .card,#v .k,#v .s,#v .tl,#v .eq,#v .bb,#v .dn .r").forEach(e=>e.style.setProperty("--i",[...e.parentNode.children].indexOf(e)));if(mOff())return;
document.querySelectorAll("#v .k b,#v .s b,#v .rc b").forEach(el=>{const t=el.textContent,m=t.match(/[\d,]+(\.\d+)?/);if(!m)return;const v=parseFloat(m[0].replace(/,/g,"")),dc=(m[1]||"").length;if(!v)return;const t0=performance.now(),st=n=>{const p=Math.min(1,(n-t0)/900),x=v*(1-Math.pow(1-p,3));el.textContent=t.replace(m[0],dc?x.toFixed(dc):Math.round(x).toLocaleString("en-KE"));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
$("#mo").onclick=()=>{const r=document.documentElement,off=r.dataset.motion=="off";r.dataset.motion=off?"on":"off";$("#mo").setAttribute("aria-pressed",off);toast(off?"Animations on.":"Animations off.");if(off)openScreen(CUR)};
const _os=openScreen;openScreen=function(n){if(n!="Dashboard"&&n!="Sign out"&&acc(n)=="none"){toast("Your role cannot open "+n+".");return}_os(n);if(n!="Dashboard"&&n!="Sign out"){lockUI(n);anim()}};
const _r3=render;render=function(){_r3();lockUI("Dashboard");anim()};
$("#fr").addEventListener("change",()=>{CURU=null;pv();applyAccess();acc(CUR)=="none"?(toast("Your role cannot open "+CUR+"."),openScreen("Dashboard")):openScreen(CUR)});
applyAccess();if(CUR!="Dashboard")openScreen(CUR);else render();
</script>
</body>
</html>
